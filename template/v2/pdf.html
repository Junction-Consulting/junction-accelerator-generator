<!DOCTYPE html>
<html lang="en" style="--pdf-header:{{HEADER}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Sans:wght@400;500&amp;family=Epilogue:wght@600;900&amp;family=Fraunces:ital,wght@1,900&amp;display=swap">
<link rel="stylesheet" href="{{ASSET_BASE}}/tokens.css">
<link rel="stylesheet" href="{{ASSET_BASE}}/print.css">
</head>
<body class="pdf" data-client-slug="{{CLIENT_SLUG}}" data-template-version="v2-pdf" data-document="{{DOCUMENT}}">
<!-- The running header's wordmark, loaded with the page so it is ready when printing -->
<img class="pdf-preload" src="{{ASSET_BASE}}/junction-wordmark-solid.png" alt="" hidden>
{{BODY}}
<!-- Login, as on the dashboard. A PDF service renders this page from content.json instead (CUTOVER.md). -->
<script src="/shared/supabase-client.js"></script>
<script src="/shared/auth.js"></script>
<script src="{{ASSET_BASE}}/print.js"></script>
</body>
</html>
